name: Set up rebar3
description: >
  Install a pinned rebar3 from its GitHub release, cached by version. Run after
  erlef/setup-beam with install-rebar false.
inputs:
  version:
    description: rebar3 version to install
    required: true
runs:
  using: composite
  steps:
    - id: asset
      uses: ./.github/actions/release-asset
      with:
        repo: erlang/rebar3
        tag: ${{ inputs.version }}
        name: rebar3
    - shell: bash
      env:
        BIN: ${{ steps.asset.outputs.path }}
        VERSION: ${{ inputs.version }}
      run: |
        chmod +x "$BIN"
        "$BIN" version | grep -q "^rebar $VERSION " \
          || { echo "::error::$BIN is not rebar3 $VERSION"; exit 1; }
        dirname "$BIN" >> "$GITHUB_PATH"
