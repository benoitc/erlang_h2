name: Interop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  h2spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: ./.github/actions/setup-rebar3
        with:
          version: '3.28.0'
      - id: h2spec
        uses: ./.github/actions/release-asset
        with:
          repo: summerwind/h2spec
          tag: v2.6.0
          name: h2spec_linux_amd64.tar.gz
      - name: Install h2spec
        run: |
          tar -xzf "${{ steps.h2spec.outputs.path }}" -C /usr/local/bin h2spec
          h2spec --version
      - run: rebar3 ct --suite=test/h2_interop_SUITE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interop-logs
          path: _build/test/logs

  grpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: ./.github/actions/setup-rebar3
        with:
          version: '3.28.0'
      - id: grpcurl
        uses: ./.github/actions/release-asset
        with:
          repo: fullstorydev/grpcurl
          tag: v1.9.3
          name: grpcurl_1.9.3_linux_x86_64.tar.gz
      - name: Install grpcurl
        run: |
          tar -xzf "${{ steps.grpcurl.outputs.path }}" -C /usr/local/bin grpcurl
          grpcurl --version
      - run: rebar3 ct --suite=test/h2_grpc_interop_SUITE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grpc-interop-logs
          path: _build/test/logs

  grpc-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: ./.github/actions/setup-rebar3
        with:
          version: '3.28.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install grpcio
        run: |
          python3 -m pip install --quiet grpcio
          python3 -c "import grpc; print('grpcio', grpc.__version__)"
      - run: rebar3 ct --suite=test/h2_grpc_client_interop_SUITE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grpc-client-interop-logs
          path: _build/test/logs
