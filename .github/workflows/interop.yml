name: Interop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REBAR3_VERSION: '3.28.0'

jobs:
  h2spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: h2spec
        with:
          path: ~/.local/h2spec
          key: h2spec-v2.6.0
      - name: Download h2spec
        if: steps.h2spec.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-release-asset.sh summerwind/h2spec v2.6.0 h2spec_linux_amd64.tar.gz ~/.local/h2spec
      - name: Install h2spec
        run: |
          tar -xzf ~/.local/h2spec/h2spec_linux_amd64.tar.gz -C /usr/local/bin h2spec
          h2spec --version
      - run: rebar3 ct --suite=test/h2_interop_SUITE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interop-logs
          path: _build/test/logs

  grpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: grpcurl
        with:
          path: ~/.local/grpcurl
          key: grpcurl-v1.9.3
      - name: Download grpcurl
        if: steps.grpcurl.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-release-asset.sh fullstorydev/grpcurl v1.9.3 grpcurl_1.9.3_linux_x86_64.tar.gz ~/.local/grpcurl
      - name: Install grpcurl
        run: |
          tar -xzf ~/.local/grpcurl/grpcurl_1.9.3_linux_x86_64.tar.gz -C /usr/local/bin grpcurl
          grpcurl --version
      - run: rebar3 ct --suite=test/h2_grpc_interop_SUITE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grpc-interop-logs
          path: _build/test/logs

  grpc-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install grpcio
        run: |
          python3 -m pip install --quiet grpcio
          python3 -c "import grpc; print('grpcio', grpc.__version__)"
      - run: rebar3 ct --suite=test/h2_grpc_client_interop_SUITE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grpc-client-interop-logs
          path: _build/test/logs
