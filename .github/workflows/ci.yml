name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REBAR3_VERSION: '3.28.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - run: rebar3 compile

  xref:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - run: rebar3 xref

  dialyzer:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: _build/default/*_plt
          key: plt-${{ runner.os }}-otp29-${{ hashFiles('rebar.config') }}
          restore-keys: plt-${{ runner.os }}-otp29-
      - run: rebar3 dialyzer

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - run: rebar3 eunit
      - run: rebar3 ct --suite=test/h2_compliance_SUITE
      - run: rebar3 cover
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ct-logs
          path: _build/test/logs
